services:
  - type: web
    name: nexo-assist
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: APP_AUTH_USERS_JSON
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO_TICKETS
        value: 'false'
      - key: USE_MASTRA
        value: 'true'
      - key: MASTRA_PROVIDER
        value: mistral
      - key: MASTRA_MODEL
        value: mistral/mistral-small-latest
      - key: MISTRAL_API_KEY
        sync: false
