services:
  - type: web
    name: nexo-assist-demo
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: nexo-assist-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /data/nexo.sqlite
      - key: APP_DEMO_LOGIN
        value: 'false'
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: USE_MASTRA
        value: 'false'
