name: Nexo QA live Mastra Mistral (isolated)
on:
  push:
    branches: ['fix/nexo-ticket-handoff-ui-a11y-20261104']
    paths: ['.github/workflows/qa-mistral.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-mistral:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexo_live_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexo_live_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexo_live_smoke
      PGSSL_DISABLE: 'true'
      NEXO_ISOLATED_TEST_DB: 'true'
      NODE_ENV: test
      APP_SESSION_SECRET: isolated-mistral-secret-not-for-production-123456
      USE_MASTRA: 'true'
      MASTRA_PROVIDER: mistral
      MASTRA_MODEL: mistral/mistral-small-latest
      SEED_DEMO_TICKETS: 'true'
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Require protected Mistral CI credential
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Real Mistral test not verified: configure MISTRAL_API_KEY as a protected GitHub Actions repository secret."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: Prepare isolated PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexo_live_smoke -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexo_live_smoke -v ON_ERROR_STOP=1 -f migrations/001_postgres.sql
      - run: npm run build
      - name: Real Mastra tool calls and audited model smoke
        run: npm run smoke:mastra
