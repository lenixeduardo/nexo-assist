name: Nexo visual audit screenshots
on:
  push:
    branches: [fix/nexo-goal-95-layout]
  workflow_dispatch:
# Re-run authenticated visual audit after repository secrets configuration.
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Run DB-independent regression tests
        run: node --test tests/policy.test.mjs tests/initialization.test.mjs tests/mastra-provider.test.mjs tests/audit-redaction.test.mjs
      - run: npm install --no-save playwright @open-pencil/cli
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory public > /tmp/nexo-static.log 2>&1 &
      - run: VISUAL_BASE_URL=http://127.0.0.1:4173 node scripts/visual-audit-capture.mjs
      - name: Capture real authenticated screens (protected test accounts)
        env:
          NEXO_AUDIT_URL: https://nexo-assist-self.vercel.app/
          NEXO_AUDIT_EMPLOYEE_EMAIL: ${{ secrets.NEXO_AUDIT_EMPLOYEE_EMAIL }}
          NEXO_AUDIT_EMPLOYEE_PASSWORD: ${{ secrets.NEXO_AUDIT_EMPLOYEE_PASSWORD }}
          NEXO_AUDIT_ANALYST_EMAIL: ${{ secrets.NEXO_AUDIT_ANALYST_EMAIL }}
          NEXO_AUDIT_ANALYST_PASSWORD: ${{ secrets.NEXO_AUDIT_ANALYST_PASSWORD }}
        run: node scripts/visual-audit-authenticated.mjs
      - name: Render six original Pencil frames (when supported)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts/visual-audit
          npx openpencil export docs/nexo.pen --node bi8Au -f png -o artifacts/visual-audit/pencil-login.png
          npx openpencil export docs/nexo.pen --node IcuoM -f png -o artifacts/visual-audit/pencil-new-ticket.png
          npx openpencil export docs/nexo.pen --node vbsNW -f png -o artifacts/visual-audit/pencil-ticket-status.png
          npx openpencil export docs/nexo.pen --node x2HBOE -f png -o artifacts/visual-audit/pencil-analyst-queue.png
          npx openpencil export docs/nexo.pen --node CAqx8 -f png -o artifacts/visual-audit/pencil-analyst-active.png
          npx openpencil export docs/nexo.pen --node i4fCbC -f png -o artifacts/visual-audit/pencil-profile.png
          if [ -f artifacts/visual-audit/pencil-login.png ]; then
            echo VISUAL_IMAGE_PENCIL_BEGIN
            base64 -w0 artifacts/visual-audit/pencil-login.png
            echo
            echo VISUAL_IMAGE_PENCIL_END
          fi
      - name: Quantify pixel difference and generate side-by-side evidence
        if: always()
        run: |
          python -m pip install --quiet pillow numpy
          python scripts/visual-audit-diff.py
          echo VISUAL_IMAGE_COMPARISON_BEGIN
          base64 -w0 artifacts/visual-audit/comparison-login.jpg
          echo
          echo VISUAL_IMAGE_COMPARISON_END
      - name: Compare all six screens with Pencil references
        if: always()
        run: |
          python -m pip install --quiet pillow numpy
          python scripts/visual-audit-six-screens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-visual-audit-evidence
          path: artifacts/visual-audit/
