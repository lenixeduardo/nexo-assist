name: Nexo QA browser and responsive evidence
on:
  push:
    branches: ['fix/nexo-ticket-handoff-ui-a11y-20261104']
  pull_request:
    branches: [main, 'fix/nexo-validation-security-20261104']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexo_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexo_test
      PGSSL_DISABLE: 'true'
      NODE_ENV: test
      NEXO_ISOLATED_TEST_DB: 'true'
      APP_SESSION_SECRET: ci-test-secret-for-isolated-screenshot-flow-123
      APP_DEMO_LOGIN: 'true'
      USE_MASTRA: 'false'
      SEED_DEMO_TICKETS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm ci --no-audit --no-fund
      - name: Create isolated service desk schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexo_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexo_test -v ON_ERROR_STOP=1 -f migrations/001_postgres.sql
      - run: npm run build
      - run: npm run qa:syntax
      - name: Install Chromium for automated QA
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Validate six screens and breakpoints
        run: node scripts/qa-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-qa-six-screens
          path: artifacts/qa-browser/
          if-no-files-found: warn
