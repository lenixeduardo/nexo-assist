name: Nexo Assist — CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - name: Domain policy regression tests
        run: node --test tests/policy.test.mjs
      - name: PostgreSQL suite
        run: echo 'PostgreSQL integration and HTTP tests run in postgres-migration.yml with a real PostgreSQL 16 service.'
