name: PostgreSQL migration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/postgres-vercel-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexo_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexo_test
      PGSSL_DISABLE: 'true'
      NODE_ENV: test
      APP_SESSION_SECRET: ci-test-secret-not-for-production-123456789
      APP_DEMO_LOGIN: 'true'
      USE_MASTRA: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create isolated schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexo_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexo_test -v ON_ERROR_STOP=1 -f migrations/001_postgres.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: PostgreSQL integration and policy tests
        run: npm test
      - name: PostgreSQL connection smoke test
        run: npm run smoke:postgres
